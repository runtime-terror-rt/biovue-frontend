name: Continous Integration and Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-build:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install make 
        run: sudo apt-get install make
      - name: Docker hub login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create .env.production file with environment variables
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://api.biovuedigitalwellness.com/api/v1' }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_RECAPTCHA_USE_ENTERPRISE: false
          NEXT_PUBLIC_RECAPTCHA_USE_RECAPTCHA_NET: false
        run: |
          cat > .env.production << EOF
          NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
          NEXT_PUBLIC_RECAPTCHA_USE_ENTERPRISE=${NEXT_PUBLIC_RECAPTCHA_USE_ENTERPRISE}
          NEXT_PUBLIC_RECAPTCHA_USE_RECAPTCHA_NET=${NEXT_PUBLIC_RECAPTCHA_USE_RECAPTCHA_NET}
          EOF
      - name: Image build and push
        run: make prod-push

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Build Files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "Makefile,docker-compose.yaml"
          target: "~/frontend"
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd ~/frontend
            make deploy

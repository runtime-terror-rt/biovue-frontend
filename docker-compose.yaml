services:
  client:
    restart: unless-stopped
    container_name: biovue-frontend
    profiles:
      - prod
    image: softvence/biovue-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
        NEXT_PUBLIC_RECAPTCHA_USE_ENTERPRISE: ${NEXT_PUBLIC_RECAPTCHA_USE_ENTERPRISE}
        NEXT_PUBLIC_RECAPTCHA_USE_RECAPTCHA_NET: ${NEXT_PUBLIC_RECAPTCHA_USE_RECAPTCHA_NET}
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "3000:3000"
